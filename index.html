/* layout: แถบค้นด้านบน + สองคอลัมน์ (สารบัญ | ผู้อ่าน) ซ้อนเป็นคอลัมน์เดียวบนมือถือ; ภาษาไทยเป็นหลัก บาลีเป็นแท็บรอง */
:root{
  --bg:#f5f6f2; --panel:#ffffff; --ink:#1f2a24; --muted:#5f6b64; --line:#dde2da;
  --accent:#2f5d50;
  --buddha:#b8660b; --buddha-soft:#fbefdc;
  --endorse:#7a5a00; --endorse-soft:#f6edc4;
  --other:#4a5a8c; --other-soft:#e8ecf7;
  --warn:#9a3b1e; --unattr:#7b3f99; --warn-soft:#fbe9e2;
  --hl:#ffe08a;
  --f-thai:"Sarabun","Noto Sans Thai",Tahoma,sans-serif;
  --f-pali:"Gentium Book Plus","Noto Serif",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b211e; --ink:#e4e9e5; --muted:#9aa6a0; --line:#2c3531;
  --accent:#7fb8a6; --buddha:#f0a54a; --buddha-soft:#33270f; --endorse:#e3c75a; --endorse-soft:#2f2a12;
  --other:#9fb0e8; --other-soft:#1e2436; --warn:#f09a7a; --unattr:#cf9ee6; --warn-soft:#3a2119; --hl:#6b5512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b211e; --ink:#e4e9e5; --muted:#9aa6a0; --line:#2c3531;
  --accent:#7fb8a6; --buddha:#f0a54a; --buddha-soft:#33270f; --endorse:#e3c75a; --endorse-soft:#2f2a12;
  --other:#9fb0e8; --other-soft:#1e2436; --warn:#f09a7a; --unattr:#cf9ee6; --warn-soft:#3a2119; --hl:#6b5512; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-thai);font-size:16px;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;padding-block:4px 12px;border-bottom:1px solid var(--line)}
h1{font-size:1.5rem;margin:0;font-weight:700;text-wrap:balance}
.homelink{color:inherit;text-decoration:none;cursor:pointer}.homelink:hover,.homelink:focus-visible{text-decoration:underline;text-underline-offset:4px}
h1 small{font-weight:400;color:var(--muted);font-size:.95rem;margin-left:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.searchbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:14px}
.searchbar input[type=search]{flex:1 1 260px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.status{font-size:.85rem;color:var(--muted);min-height:1.4em}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:80vh;overflow:auto;position:sticky;top:env(safe-area-inset-top,0px)}
@media (max-width:860px){.side{position:static;max-height:46vh}}
.side h2{font-size:.8rem;letter-spacing:.06em;color:var(--muted);margin:0;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.grp{border-bottom:1px solid var(--line)}
.sub .grp{border-bottom:none;border-top:1px solid var(--line)}
.sub .grp>button{padding-left:24px}
.sub .slist a{padding-left:32px}
.sectoc{margin:0 0 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sectoc summary{cursor:pointer;padding:8px 12px;font-weight:600;color:var(--accent)}
.sectoc ol{margin:0;padding:4px 12px 10px 2.4em;columns:2;column-gap:28px;font-size:.93rem}
@media (max-width:640px){.sectoc ol{columns:1}}
.sectoc li{break-inside:avoid;margin:2px 0}
.sectoc a{color:var(--ink);text-decoration:none}
.sectoc a:hover{color:var(--accent);text-decoration:underline}
.sectoc .sp{font-size:.78rem;color:var(--muted)}
.sectoc .tnote{font-size:.8rem;color:var(--muted);padding:0 12px 10px}
.sechead{margin:1.6em 0 .6em;padding:8px 12px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0}
.sechead .t{font-weight:700;font-size:1.05rem}
.sechead .m{font-size:.8rem;color:var(--muted)}
.sechead .m b{color:var(--buddha);font-weight:600}
.secnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 14px}
.secnav button{font-size:.88rem;padding:6px 10px}
.secnav .where{font-size:.85rem;color:var(--muted);flex:1 1 200px}
.backbtn{margin-bottom:12px;font-size:.92rem}
.nkhead{font-size:.78rem;letter-spacing:.05em;color:var(--muted);padding:12px 14px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.grp>button{all:unset;display:flex;gap:8px;width:100%;box-sizing:border-box;padding:9px 14px;cursor:pointer;justify-content:space-between;align-items:baseline}
.grp>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.gn{font-weight:600}
.gp{font-family:var(--f-pali);color:var(--muted);font-size:.9rem}
.gc{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.slist{list-style:none;margin:0;padding:0 0 6px}
.slist a{display:flex;gap:8px;padding:5px 14px 5px 22px;text-decoration:none;color:var(--ink);font-size:.95rem;align-items:baseline}
.slist a:hover{background:var(--bg)}
.slist a.on{background:var(--buddha-soft)}
.sid{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);min-width:5.4em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 7px;align-self:center}
.bar{flex:0 0 34px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;align-self:center}
.bar i{display:block;height:100%;background:var(--buddha)}
main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.empty h2{margin:0 0 8px;font-size:1.15rem}
.empty p{margin:.4em 0;max-width:65ch}
code{font-family:var(--f-mono);font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{font-size:.92rem;padding:6px 10px}
.sh h2{margin:0;font-size:1.45rem;text-wrap:balance}
.sh .pt{font-family:var(--f-pali);font-style:italic;color:var(--muted);font-size:1rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;color:var(--muted);margin:8px 0 10px}
.meta a{color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.pill{font-size:.82rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.pill.b{border-color:var(--buddha);color:var(--buddha);background:var(--buddha-soft)}
.pill.q{border-color:var(--endorse);color:var(--endorse);background:var(--endorse-soft)}
.pill.w{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
/* Gemini Edition: โหมดกรองพุทธพจน์ + คู่ขนานบาลี-ไทย + ปุ่มคัดลอกท่อน */
.bfltbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.84rem;color:var(--muted);margin:0 0 12px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.bfltbar .lbl{font-weight:600;color:var(--ink)}
.bfltgrp{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.bfltgrp button{border:0;border-right:1px solid var(--line);border-radius:0;padding:4px 10px;font-size:.82rem;background:transparent;color:var(--muted);cursor:pointer}
.bfltgrp button:last-child{border-right:0}
.bfltgrp button.on{background:var(--buddha);color:#fff;font-weight:600}
.bfltbar .en-tog{margin-left:auto;display:inline-flex;gap:5px;align-items:center;color:var(--ink);cursor:pointer;font-size:.82rem}
#tabbody.bf-dim .seg.O,#tabbody.bf-dim .seg.N{opacity:.32;transition:opacity .15s}
#tabbody.bf-dim .seg.O:hover,#tabbody.bf-dim .seg.N:hover{opacity:.95}
#tabbody.bf-dim .pr-row.O>div,#tabbody.bf-dim .pr-row.N>div{opacity:.32;transition:opacity .15s}
#tabbody.bf-dim .pr-row.O:hover>div,#tabbody.bf-dim .pr-row.N:hover>div{opacity:.95}
#tabbody.bf-dim .thai .sp.O,#tabbody.bf-dim .thai .sp.N{opacity:.32;transition:opacity .15s}
#tabbody.bf-dim .thai .sp.O:hover,#tabbody.bf-dim .thai .sp.N:hover{opacity:.95}
#tabbody.bf-au .seg:not(.B):not(.U){display:none}
#tabbody.bf-au .pr-row:not(.B):not(.U):not(.H){display:none}
#tabbody.bf-au .thai .sp.O,#tabbody.bf-au .thai .sp.N{opacity:.18;font-size:.88em}
#tabbody.bf-au .pblk.no-au{display:none}
#tabbody.bf-only .seg:not(.B){display:none}
#tabbody.bf-only .pr-row:not(.B):not(.H){display:none}
#tabbody.bf-only .thai .sp.O,#tabbody.bf-only .thai .sp.N,#tabbody.bf-only .thai .sp.U{opacity:.18;font-size:.88em}
#tabbody.bf-only .pblk.no-b{display:none}
#tabbody.hide-gloss .gloss{display:none}
#tabbody.hide-en .pe,#tabbody.hide-en .seg .e{display:none}
.seg.U{border-left-color:var(--unattr);background:color-mix(in srgb,var(--unattr) 10%,transparent)}
.seg.U .who{color:var(--unattr)}
.pr-row.U .pl{border-left-color:var(--unattr)} .pr-row.U .tl{color:var(--unattr)}
.s3.sn-dim-r .s3s.R,.s3.sn-dim-r .s3lead,.s3.sn-dim-r .s3syn{opacity:.3;transition:opacity .15s}
.s3.sn-dim-r .s3s.R:hover{opacity:.95}
.s3.sn-only-p .s3s.R,.s3.sn-only-p .s3s.ot,.s3.sn-only-p .s3lead,.s3.sn-only-p .s3syn{opacity:.22;transition:opacity .15s}
.s3.sn-only-p .s3s.R:hover,.s3.sn-only-p .s3s.ot:hover{opacity:.95}
.cpseg{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;padding:1px 6px;font:500 .68rem var(--f-thai);cursor:pointer;margin-left:6px;vertical-align:middle}
.cpseg:hover{border-color:var(--accent);color:var(--accent)}
.cpseg.ok{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.thai{font-size:1.08rem;line-height:1.95;max-width:72ch}
.thai p{margin:0 0 .75em}
.thai .kho{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);margin-right:4px}
.thai h3{font-size:1rem;margin:1.2em 0 .4em;color:var(--muted)}
.thai .gloss{color:var(--muted);font-style:italic}
.thai .sp.O{color:var(--other)}
.thai .sp.N{color:var(--muted)}
.thai .sp.U{color:var(--unattr)}
.thai .sp.H{color:var(--muted);font-weight:600}
.thai .sp.Q{text-decoration:underline dotted var(--warn);text-decoration-thickness:1.5px;text-underline-offset:5px}
.thai.nospk .sp{color:inherit;text-decoration:none;font-weight:inherit}
.spkbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.85rem;color:var(--muted);margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.spkbar label{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-weight:600;cursor:pointer}
.spkbar .k{display:inline-flex;gap:5px;align-items:center}
.spkbar .k i{font-style:normal}
.spkbar .kO{color:var(--other)} .spkbar .kU{color:var(--unattr)} .spkbar .kN{color:var(--muted)} .spkbar .kQ{text-decoration:underline dotted var(--warn);text-underline-offset:4px}
.rs .spk{font-weight:600}
.thai p.focusp{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.focusnote{font-size:.85rem;color:var(--muted);margin:0 0 10px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--bg)}
.warnbox{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:.9rem;margin-bottom:14px;max-width:72ch}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 18px;padding:5px 10px 5px 12px;border-left:4px solid transparent}
@media (max-width:640px){.seg{grid-template-columns:minmax(0,1fr)}}
.seg.B{border-left-color:var(--buddha);background:var(--buddha-soft)}
.seg.Bq{border-left-color:var(--endorse);background:var(--endorse-soft)}
.seg.O{border-left-color:var(--other);background:var(--other-soft)}
.seg.N{border-left-color:var(--line)}
.seg.N .p,.seg.N .e{color:var(--muted)}
.p{font-family:var(--f-pali);font-size:1.02rem}
.e{font-size:.93rem}
.who{grid-column:1/-1;font-size:.78rem;font-weight:600;margin-top:8px;display:flex;gap:8px;align-items:center}
.who .tag{font-family:var(--f-mono);font-weight:500;padding:0 6px;border-radius:4px;border:1px solid currentColor}
.seg.B .who{color:var(--buddha)} .seg.Bq .who{color:var(--endorse)} .seg.O .who{color:var(--other)}
.segid{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);user-select:all}
mark{background:var(--hl);color:inherit;border-radius:2px}
.res{display:flex;flex-direction:column;gap:12px}
.rs h3{margin:0 0 4px;font-size:1rem}
.rs h3 a{color:var(--accent);text-decoration:none}
.rs .where{font-size:.82rem;color:var(--muted);margin-bottom:6px}
.rs .snip{font-size:1rem;line-height:1.8;margin:.2em 0}
.rs .seg{cursor:pointer}
.note{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:12px;max-width:80ch}
details.help{margin-top:14px}

details.help ul{margin:.4em 0;padding-left:1.2em;max-width:72ch}
.par{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid var(--line)}
.pr-row{display:contents}
.pr-row>div{padding:6px 10px;border-bottom:1px solid var(--line);font-size:.93rem;line-height:1.55}
.pr-row .pl{border-left:3px solid var(--line)}
.pr-row.B .pl{border-left-color:var(--buddha)} .pr-row.O .pl{border-left-color:var(--other)} .pr-row.O .tl{color:var(--other)} .pr-row.N .tl{color:var(--muted)}

.title-hits{border-left:4px solid var(--accent);background:var(--bg)}
.title-hits h3{font-size:.95rem;margin-bottom:8px}
.title-list{display:flex;flex-wrap:wrap;gap:6px 10px}
.title-pill{display:inline-flex;align-items:baseline;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:.86rem}
.title-pill:hover{border-color:var(--accent);color:var(--accent)}
.title-pill .tid{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.title-pill .tsub{font-size:.76rem;color:var(--muted)}
.pr-row .mg{color:var(--muted)}
.pr-row.H>div{background:var(--bg);font-size:.85rem;color:var(--muted)} .pr-row .hh{font-size:.74rem;font-weight:600}

/* ===== Short note พุทธพจน์ ===== */

.npaper{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:860px){.npaper{grid-template-columns:minmax(0,1fr)}}
.nbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px 20px;overflow:hidden;scroll-margin-top:12px}
.nbox::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.nbox.L{grid-column:1/-1}
.nbox.S{background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--bg) 10px 20px);border-style:dashed}
.nbox.flash{animation:nflash 1.4s ease}
@keyframes nflash{0%,40%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.nbox .zn{font-size:.74rem;font-weight:700;color:var(--c);letter-spacing:.02em}
.nbox h3{margin:2px 0 6px;font-size:1.22rem;line-height:1.35;text-wrap:balance}
.nbox .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:var(--panel);font-size:.85rem;margin-right:8px;vertical-align:2px}
.nlead{font-size:.95rem;margin:0 0 10px;display:inline;background:linear-gradient(transparent 58%, color-mix(in srgb,var(--c) 26%, transparent) 58%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.nlead-w{margin-bottom:10px}
.nlead-w .by{font-size:.7rem;color:var(--muted);display:block}
.nbody{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.nbox.L .nbody{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
@media (max-width:860px){.nbox.L .nbody{grid-template-columns:minmax(0,1fr)}}
.nbox.L.wide .nbody{grid-template-columns:minmax(0,1fr)}
.nlines{list-style:none;margin:0;padding:0}
.nlines li{position:relative;padding:4px 0 4px 22px;font-size:.93rem;line-height:1.5;border-bottom:1px dotted var(--line)}
.nlines li:last-child{border-bottom:0}
.nlines li::before{content:"•";position:absolute;left:6px;top:4px;color:var(--c);font-weight:700}
.nlines li.mk-key::before{content:"★";left:2px;color:var(--buddha)}
.nlines li.mk-warn::before{content:"⚠";left:1px;color:var(--warn)}
.nlines li.mk-gap::before{content:"?";left:5px;color:var(--muted);font-weight:800}
.nlines li.mk-contrast::before{content:"⇄";left:1px;color:var(--other);font-weight:800}
.nlines li.R{font-style:italic;color:var(--muted)}
.nlines .nt{display:block;font-size:.78rem;color:var(--muted);font-style:normal}
.rc{display:inline-flex;align-items:center;gap:3px;font:500 .72rem var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px;background:var(--bg);color:var(--accent);cursor:pointer;vertical-align:1px;white-space:nowrap}
.rc:hover,.rc:focus-visible{border-color:var(--accent);outline:none}
.lv.R{color:var(--muted);background:transparent;border-color:var(--muted);border-style:dotted}
.nlines .lv,.nfig .lv{margin-left:4px;vertical-align:1px;height:16px;font-size:.64rem;min-width:16px}
.nquote{margin:0;border-left:4px solid var(--buddha);background:var(--buddha-soft);border-radius:0 8px 8px 0;padding:9px 12px;font-size:.92rem}
.nquote .qt::before{content:"“";font-size:1.6rem;line-height:0;vertical-align:-.4em;color:var(--buddha);margin-right:2px}
.nquote .qp{display:block;font-family:var(--f-pali);font-style:italic;color:var(--muted);font-size:.86rem;margin-top:5px}
.nquote .qw{display:block;margin-top:6px;font-size:.8rem;color:var(--warn)}
.nquote .qh{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--muted);margin-bottom:3px}
.naside{background:color-mix(in srgb,var(--endorse-soft) 85%, var(--panel));border:1px solid color-mix(in srgb,var(--endorse) 30%, transparent);border-radius:4px 10px 10px 10px;padding:7px 10px;font-size:.86rem;transform:rotate(-.4deg);box-shadow:2px 3px 0 color-mix(in srgb,var(--endorse) 18%, transparent)}
.naside .t::before{content:"✎ ";color:var(--endorse)}
.nlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:.8rem;align-items:center}
.nlinks .lb{color:var(--muted)}
.nlinks a{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg);cursor:pointer}
.nlinks a i{width:18px;border-top:2px solid var(--ink)} .nlinks a.room i{border-top:2px dashed var(--muted)}
.nlinks a small{color:var(--muted)}
/* ภาพประกอบ */
.nfig{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.86rem;position:relative}
.nfig .fcap{font-size:.74rem;color:var(--muted);margin-top:8px;line-height:1.45}
.nfig .fcap::before{content:"ⓘ "}
.ld-rows{display:grid;gap:4px}
.ld-rows .hd{font-size:.76rem;font-weight:700;color:var(--muted);text-align:center;align-self:end}
.ld-rows .rl{font-size:.76rem;font-weight:600;align-self:center;text-align:right;padding-right:6px;border-right:2px solid var(--line)}
.ld-rows .rl.top{color:var(--buddha)}
@media (max-width:560px){.ld-rows{grid-template-columns:repeat(2,minmax(0,1fr))!important}.ld-rows>span:first-child{display:none}.ld-rows .rl{grid-column:1/-1;text-align:left;border-right:0;border-bottom:2px solid var(--line);padding:6px 0 1px;margin-top:4px}}
.rc{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stp{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:4px 7px;line-height:1.4;font-size:.82rem;position:relative}
.stp.el{border-style:dashed;border-left-style:dashed}
.stp.key{box-shadow:0 0 0 2px color-mix(in srgb,var(--buddha) 55%, transparent)}
.stp .tg{display:inline-block;font:600 .64rem var(--f-mono);color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 4px;margin-left:4px;cursor:help}
.stp .vl{display:inline-block;font:700 .72rem var(--f-mono);background:var(--buddha);color:var(--panel);border-radius:4px;padding:0 5px;margin-right:4px}
.stp .nn{display:block;font-size:.72rem;color:var(--muted)}
.stp .eq{display:block;font-size:.7rem;color:var(--other)}
.stp.empty{background:transparent;border:0}
.ld-arrow{position:absolute;left:4px;top:10px;bottom:10px;width:0;border-left:2px solid var(--line)}
.ld-cols{display:grid;gap:14px;position:relative}
.ld-col{display:flex;flex-direction:column}
.ld-col .stk{flex:1}
.ld-col h5{margin:0 0 6px;font-size:.8rem;text-align:center;color:var(--ink)}
.ld-col .stk{display:flex;flex-direction:column-reverse;gap:6px;position:relative}
.ld-col .stk::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--line);z-index:0}
.ld-col .stp{z-index:1}
.ld-col .up{text-align:center;font-size:.7rem;color:var(--muted)}
.ld-svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.ld-svg path{fill:none;stroke:var(--other);stroke-width:1.6;stroke-dasharray:5 4;opacity:.75}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.pr .sd{display:flex;flex-direction:column;gap:5px}
.pr .sd h5{margin:0 0 2px;font-size:.84rem;text-align:center}
.pr .ct{max-width:9.5em;text-align:center;font-size:.76rem;font-weight:700;color:var(--buddha);border:2px solid var(--buddha);border-radius:999px;padding:6px 8px;background:var(--buddha-soft)}
@media (max-width:520px){.pr{grid-template-columns:minmax(0,1fr)}.pr .ct{max-width:none}}
.fd .plot{border-radius:8px;padding:8px 10px 10px;position:relative;color:var(--ink)}
.fd .plot h5{margin:0 0 4px;font-size:.86rem}
.fd .good{background:repeating-linear-gradient(0deg,color-mix(in srgb,#5b8a3a 22%, var(--panel)) 0 8px,color-mix(in srgb,#5b8a3a 10%, var(--panel)) 8px 16px)}
.fd .bad{background:repeating-linear-gradient(0deg,color-mix(in srgb,#8a6a3a 22%, var(--panel)) 0 8px,color-mix(in srgb,#8a6a3a 8%, var(--panel)) 8px 16px)}
.fd .plot .ic{font-size:1rem;margin-right:4px}
.fd .seed{text-align:center;font-size:.76rem;color:var(--muted);margin:4px 0}
.ls{list-style:none;margin:0;padding:0;counter-reset:n;display:flex;flex-direction:column;gap:5px}
.ls li{counter-increment:n;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.ls li::before{content:counter(n, thai);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--panel);font-size:.76rem}
.ls.fr li{grid-template-columns:24px minmax(0,1fr) 18px minmax(0,1.3fr)}
.ls .ar{color:var(--muted);text-align:center}
.ls .fruit{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:.8rem}
@media (max-width:520px){.ls.fr li{grid-template-columns:24px minmax(0,1fr)}.ls .ar{display:none}.ls .fruit{grid-column:2}}
.fl{display:flex;gap:6px;align-items:stretch}
.fl .stp{flex:1}
.fl .ar{align-self:center;color:var(--muted);font-size:1.1rem}
.fl.v{flex-direction:column}
.fl.v .ar{transform:rotate(90deg);align-self:center;line-height:1}
@media (max-width:520px){.fl{flex-direction:column}.fl .ar{transform:rotate(90deg);align-self:center}}
.qa{display:flex;flex-direction:column;gap:8px}
.qa .q{font-weight:600;font-size:.86rem}
.qa .q small{font-weight:400;color:var(--muted)}
.qa .q::before{content:"ถาม ";color:var(--other);font-weight:800}
.qa .a{margin-left:14px;font-size:.86rem;border-left:3px solid var(--buddha);padding-left:8px}
.qa .a::before{content:"ตรัส ";color:var(--buddha);font-weight:800}
/* แผงสรุปพระสูตร */
.ndrawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.14);transform:translateX(105%);transition:transform .22s ease;z-index:50;overflow:auto;padding:16px 18px 30px}
.ndrawer.open{transform:none}
@media (max-width:640px){.ndrawer{top:auto;width:100vw;max-height:80vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(105%)}}
.ndrawer .x{position:sticky;top:0;float:right;font-size:1.2rem;border:1px solid var(--line);background:var(--panel);border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--ink)}
.ndrawer h3{margin:0 0 2px;font-size:1.2rem}
.ndrawer .sid{font:500 .8rem var(--f-mono);color:var(--muted)}
.ndrawer dl{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 10px;font-size:.88rem;margin:10px 0}
.ndrawer dt{color:var(--muted);font-size:.8rem}
.ndrawer dd{margin:0}
.ndrawer .pt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.92rem}
.ndrawer .pt .by{display:block;font-size:.72rem;color:var(--muted)}
.ndrawer h4{font-size:.78rem;color:var(--muted);margin:14px 0 6px}
.ndrawer .part{border:1px solid var(--line);border-left:4px solid var(--buddha);border-radius:8px;padding:7px 10px;margin-bottom:7px;font-size:.88rem}
.ndrawer .part.B,.ndrawer .part.BP{border-left-color:var(--endorse)} .ndrawer .part.U{border-left-color:var(--muted)} .ndrawer .part.none{border-left-color:var(--other)}
.ndrawer .part.hit{box-shadow:0 0 0 2px var(--accent)}
.ndrawer .part .rid{font:500 .74rem var(--f-mono);color:var(--muted)}
.ndrawer .acts{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.ndrawer .acts a{font-size:.78rem;padding:2px 9px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--accent);background:var(--bg)}
.ndrawer .wb{background:var(--warn-soft);border-left:3px solid var(--warn);padding:6px 9px;border-radius:4px;font-size:.84rem}
.ndrawer details summary{cursor:pointer;font-size:.78rem;color:var(--accent);margin-top:5px}
.ndrawer .pv{margin-top:5px;font-size:.86rem;max-height:240px;overflow:auto}
.ndrawer .pv .s{padding:2px 6px 2px 8px;border-left:3px solid var(--line);margin-bottom:3px}
.ndrawer .pv .s.B{border-left-color:var(--buddha);background:var(--buddha-soft)}
.ndrawer .pv .s.O{border-left-color:var(--other);background:var(--other-soft)}
.ndrawer .pv .w{font:500 .66rem var(--f-mono);color:var(--muted)}
.ndrawer .pv .e{font-size:.78rem;color:var(--muted)}
.ndrawer .pv .p{font-family:var(--f-pali)}
.ndrawer .hitref{font-size:.8rem;color:var(--muted);margin-top:4px}
.nscrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:49;display:none}
.nscrim.open{display:block}
.nfoot{font-size:.8rem;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
@media print{
  header .topnav,.ntools,.ndrawer,.nscrim,#sf,#status,.legend,.ntoc{display:none!important}
  body{background:#fff}
  .npaper{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .nbox{break-inside:avoid;box-shadow:none}
  .rc{color:#555}
}

/* ===== แผนผังธรรม ===== */
[hidden]{display:none!important}
:root{--g1:#b5651d;--g2:#2e7d6b;--g3:#6a5acd;--g4:#3b7fb6;--g5:#a8892a;--g6:#b0466b;--g7:#5f7d2f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g1:#e39a5a;--g2:#62c2aa;--g3:#a99bf0;--g4:#79b4e6;--g5:#dcc062;--g6:#e98aab;--g7:#a5c86c}}
:root[data-theme="dark"]{--g1:#e39a5a;--g2:#62c2aa;--g3:#a99bf0;--g4:#79b4e6;--g5:#dcc062;--g6:#e98aab;--g7:#a5c86c}
.topnav{display:flex;gap:6px;align-items:center}
.topnav a{font-size:.9rem;padding:5px 11px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--panel)}
.topnav a.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
#mapview{padding-top:14px}
.mhead{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.mhead h2{margin:0;font-size:1.5rem}
.mhead h2 small{font-family:var(--f-pali);font-style:italic;font-weight:400;color:var(--muted);font-size:1rem;margin-left:8px}
.mhead .sub{font-size:.88rem;color:var(--muted);max-width:70ch;margin-top:2px}
.mtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mtools button{font-size:.85rem;padding:5px 10px}
.mtools button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.mtools .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px;align-items:start}
@media (max-width:1020px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.mcanvas{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;position:relative;
  background-image:radial-gradient(circle at center, color-mix(in srgb, var(--accent) 7%, transparent) 0, transparent 60%),radial-gradient(var(--line) 1px, transparent 1px);
  background-size:100% 100%,22px 22px}
.mfit{position:relative;transform-origin:0 0}
.mstage{position:absolute;left:0;top:0;width:1240px;height:1040px}
.mstage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:var(--line);stroke-dasharray:2 6}
.e-tree{fill:none;stroke-width:2;opacity:.45}
.e-hub{fill:none;stroke-width:5;opacity:.35;stroke-linecap:round}
.e-x{fill:none;stroke:var(--ink);stroke-width:1.6;opacity:.38;transition:opacity .2s}
.e-x.room{stroke:var(--muted);stroke-dasharray:6 5}
.e-x.on{opacity:.95;stroke-width:2.6}
.e-x.off,.e-tree.off{opacity:.07}
.e-x.hid{display:none}
.e-lab{font:600 12px var(--f-mono);fill:var(--ink)}
.e-labbg{fill:var(--panel);stroke:var(--ink);stroke-width:1}
.mroot{position:absolute;width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--buddha) 30%, var(--panel)), var(--buddha-soft));border:3px solid var(--buddha);cursor:pointer;
  box-shadow:0 0 0 10px color-mix(in srgb,var(--buddha) 10%, transparent),0 0 0 22px color-mix(in srgb,var(--buddha) 5%, transparent)}
.mroot b{font-size:2.3rem;line-height:1;color:var(--ink)}
.mroot i{font-family:var(--f-pali);color:var(--muted);margin-top:4px}
.mhub{position:absolute;display:flex;gap:8px;align-items:center;padding:7px 14px 7px 7px;border-radius:999px;border:2px solid var(--c);
  background:color-mix(in srgb,var(--c) 14%, var(--panel));font-weight:700;cursor:pointer;white-space:nowrap;font-size:1rem;color:var(--ink)}
.mhub .n{width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--panel);display:grid;place-items:center;font-size:.95rem}
.mhub .ct{font:500 .75rem var(--f-mono);color:var(--muted);font-weight:500}
.mhub.col{border-style:dashed;opacity:.8}
.mhub.col .ct::after{content:" ซ่อน"}
.mnode{position:absolute;width:164px;padding:7px 10px 7px 12px;border-radius:9px;background:var(--panel);border:1px solid color-mix(in srgb,var(--c) 45%, var(--line));
  border-left:5px solid var(--c);font-size:.86rem;line-height:1.38;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:opacity .2s, box-shadow .2s, transform .15s;text-align:left;font-family:var(--f-thai);color:var(--ink)}
.mnode:hover{box-shadow:0 3px 10px rgba(0,0,0,.14);transform:translateY(-1px)}
.mnode.gap{border:1.5px dashed var(--muted);border-left:5px dashed var(--muted);background:repeating-linear-gradient(135deg,var(--panel) 0 8px,var(--bg) 8px 16px)}
.mnode.sel{box-shadow:0 0 0 3px var(--accent)}
.mnode.nb{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%, transparent)}
.mnode.dim,.mhub.dim{opacity:.22}
.mnode.hid,.mhub.hid{display:none}
.mnode .t{font-weight:600;display:block}
.mnode .f{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.lv{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border-radius:4px;font:700 .7rem var(--f-mono);border:1px solid;cursor:pointer;line-height:1}.lv:hover{filter:brightness(.94)}
.lv.A{color:var(--buddha);background:var(--buddha-soft);border-color:var(--buddha)}
.lv.B,.lv.BP{color:var(--endorse);background:var(--endorse-soft);border-color:var(--endorse)}
.lv.C{color:var(--warn);background:var(--warn-soft);border-color:var(--warn)}
.lv.U{color:var(--muted);background:var(--bg);border-color:var(--muted)}
.lv.G{color:var(--muted);background:transparent;border-style:dashed;border-color:var(--muted)}
.wm{color:var(--warn);font-weight:700}
.mside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
@media (max-width:1020px){.mside{position:static;max-height:none}}
.mside h3{margin:0 0 4px;font-size:1.15rem;text-wrap:balance}
.mside .bchip{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 9px;margin-bottom:8px}
.mside .bchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mside h4{font-size:.78rem;letter-spacing:.05em;color:var(--muted);margin:16px 0 6px;text-transform:none}
.sumbox{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.95rem}
.sumbox .by{display:block;font-size:.74rem;color:var(--muted);margin-bottom:4px}
.gapbox{border:1.5px dashed var(--muted)}
.ref{border:1px solid var(--line);border-left:4px solid var(--buddha);border-radius:8px;padding:8px 10px;margin:0 0 8px}
.ref.BP,.ref.B{border-left-color:var(--endorse)} .ref.U{border-left-color:var(--muted)} .ref.C{border-left-color:var(--warn)}

async function getJSON(path){
  // ลองซ้ำเมื่อโหลดไม่สำเร็จชั่วคราว แต่ถ้า 404 ไม่พบไฟล์ให้หยุดทันทีไม่ต้องรอหน่วงเวลา
  let r;
  for(let k=0;k<3;k++){
    try {
      r = await fetch(path, k ? {cache:'reload'} : undefined);
      if(r.ok) return r.json();
      if(r.status === 404) throw new Error(path + ' 404');
    } catch(e) {
      if(String(e.message).includes('404')) throw e;
      r = {status: e.message};
    }
    await new Promise(res => setTimeout(res, 700*(k+1)));
  }
  throw new Error(path+' '+r.status);
}
async function loadGroup(g){
  if(state.groups[g]) return state.groups[g];
  const arr = await getJSON('data/'+nkOf(g)+'-'+g+'.json'); const m = {}; arr.forEach(s => m[s.id] = s.segs);
  return (state.groups[g] = m);
}
async function loadThai(v){

async function loadSpk(v){
  if(!SPKVOLS.includes(+v)) return null;
  if(state.spk[v] !== undefined) return state.spk[v];
  try { state.spk[v] = await getJSON('data/spk-v'+pad2(v)+'.json'); } catch(e) { state.spk[v] = null; }
  return state.spk[v];
}
async function loadAln(v){
  const k = 'a'+v;
  if(state.spk[k] !== undefined) return state.spk[k];
  try { state.spk[k] = SPKVOLS.includes(+v) ? await getJSON('data/aln-v'+pad2(v)+'.json') : null; } catch(e) { state.spk[k] = null; }
  return state.spk[k];
}
function spkAt(spans, off){
  let lo = 0, hi = spans.length - 1;
  while(lo <= hi){ const m = (lo+hi)>>1, s = spans[m]; if(off < s[0]) hi = m-1; else if(off >= s[1]) lo = m+1; else return s[2]; }
  return '?';
}
async function loadAll(kind){
  if(kind==='th'){
    const vs=THVOLS; let d=0;
    await Promise.all(vs.map(async v => { await loadThai(v); d++; $('#status').textContent = `กำลังโหลดฉบับหลวง ${d}/${vs.length} เล่ม…`; }));
    return;

}

function fillList(ul, list){
  ul.innerHTML = list.map(s => {
    const pct = s.n ? Math.round(100*s.b/s.n) : 0;

  }).join('');
}

function cls(seg){ if(seg.s==='H') return 'H'; if(seg.s==='B') return 'B'; if(seg.s===UNATTR) return 'U'; if(seg.l==='B?') return 'Bq'; if(seg.s==='N') return 'N'; return 'O'; }
function whoLabel(seg){
  if(seg.s==='B') return ['พระพุทธเจ้า','A'];
  if(seg.s===UNATTR) return ['ไม่ระบุผู้กล่าวในตัวบท','⚪'];
  if(seg.s==='N') return null;
  const n = seg.s==='listeners' ? 'ผู้ฟัง' : (seg.s==='?'||seg.s.startsWith('unknown')) ? 'ไม่ทราบผู้พูด' : seg.s;
  return [n, seg.l==='B?' ? 'B?' : '—'];
}
function hlFold(html, term){
  const t = fold(term); if(!t) return html;
  let f = '', map = [];
  for(let i=0;i<html.length;i++){ const fc = fold(html[i]); for(let k=0;k<fc.length;k++){ f += fc[k]; map.push(i); } }
  let out = '', last = 0, from = 0, pos;
  while((pos = f.indexOf(t, from)) !== -1){ const a = map[pos], b = map[pos+t.length-1]+1; if(a < last){ from = pos+1; continue; } out += html.slice(last,a)+'<mark>'+html.slice(a,b)+'</mark>'; last = b; from = pos+t.length; }
  return out + html.slice(last);
}
function buildEnMap(segs){
  const normP = p => (p||'')
    .replace(/^\s*(?:\(…\)|…)\s*/,'')
    .replace(/^ya(?:ñca|ṁ)\b/i,'yaṁ')
    .replace(/[\s“”‘’\.,;:\-\—\(\)…]+/g,' ')
    .trim().toLowerCase().slice(0,44);
  const normE = e => (e||'').replace(/\W+/g,' ').trim().toLowerCase().slice(0,28);
  const seen = new Map(), out = new Array(segs.length).fill(null);
  let inUddana = false;

  for(let k=0; k<segs.length; k++){
    const sg = segs[k], pk = normP(sg.p);
    if(sg.e){
      if(pk && !seen.has(pk)) seen.set(pk, {id: sg.i, e: sg.e});
      else if(pk && seen.has(pk)){
        const prev = seen.get(pk);
        if(normE(prev.e) !== normE(sg.e) && segs[k+1] && !segs[k+1].e){
          let endK = k + 1;
          while(endK + 1 < segs.length && !segs[endK + 1].e && segs[endK + 1].s !== 'H' && !/(uddānaṁ|vaggo|niṭṭhitaṁ|samattaṁ|dasamo|paṭhamo|dutiyo)$/i.test(segs[endK + 1].p||'')) endK++;
          out[endK] = `<span class="pe pe-ref"><b>สรุปความช่วงย่อ</b> · ${esc(sg.e)}</span>`;
          out[k] = `<span class="pe pe-ref"><b>↻ ทวนความจาก ${esc(prev.id)}</b> · ${esc(prev.e)}</span>`;
          continue;
        }
      }
      out[k] = `<span class="pe">${esc(sg.e)}</span>`;
    }
  }

  for(let k=0; k<segs.length; k++){
    if(out[k]) continue;
    const sg = segs[k], p = (sg.p||'').trim(), pk = normP(p);
    if(/Tassuddānaṁ/i.test(p)) inUddana = true;
    if(inUddana || /(uddānaṁ|vaggo|niṭṭhitaṁ|samattaṁ|paṭhamo|dutiyo|tatiyo|catuttho|pañcamo|chaṭṭho|sattamo|aṭṭhamo|navamo|dasamo)$/i.test(p)){
      out[k] = '<span class="pe ne">คาถาอุททาน / สรุปท้ายวรรค</span>';
    } else if(pk && seen.has(pk)){
      const ref = seen.get(pk);
      out[k] = `<span class="pe pe-ref"><b>↻ ทวนความจาก ${esc(ref.id)}</b> · ${esc(ref.e)}</span>`;
    } else if(/pe…|…pe/.test(p)){
      out[k] = '<span class="pe ne">… ย่อความ (…pe…)</span>';
    } else {
      out[k] = '<span class="pe ne">〃 รวมความในท่อนข้างเคียง</span>';
    }
  }
  return out;
}
function segHTML(seg, prev, terms){
  const c = cls(seg); if(c==='H') return '';
  let who = '';
  if((!prev || prev.s!==seg.s || prev.l!==seg.l) && c!=='N'){ const w = whoLabel(seg); if(w) who = `<div class="who">${esc(w[0])} <span class="tag">${w[1]}</span></div>`; }
  const hl = t => { let h = esc(t); (terms||[]).forEach(tm => h = hlFold(h, tm)); return h; };
  return `<div class="seg ${c}" data-id="${seg.i}">${who}<div class="p" lang="pi">${hl(seg.p)}</div><div class="e" lang="en">${hl(seg.e)}</div><div class="segid">${seg.i}${trnBadge((state.trnSeg || {})[seg.i])}<button type="button" class="cpseg" data-cp="${esc(seg.i)}" title="คัดลอกรหัสท่อนและข้อความ">คัดลอก</button></div></div>`;
}
function thaiChunk(str, first, term){
  let h = esc(str);
  if(first) h = h.replace(/^\[([๐-๙]+)\]\s*/, (m,k) => `<span class="kho">[${k}]</span>`);
  h = h.replace(/\[([^\]๐-๙<][^\]<]{0,120})\]/g, '<span class="gloss" title="คำเสริมของผู้แปลฉบับหลวง ไม่มีในบาลี">[$1]</span>');
  h = h.replace(/\((?![๐-๙\s.,]+\))([^()<]{1,120})\)/g, '<span class="gloss" title="คำในวงเล็บของผู้แปลฉบับหลวง ไม่มีในบาลี">($1)</span>');

// spans = [[เริ่ม, จบ, ป้าย]] ในพิกัดของข้อความทั้งหน่วย; base = ตำแหน่งของ text ในหน่วยนั้น
function thaiHTML(text, term, spans, base){
  let off = base || 0;
  return text.split('\n').map(p => {
    const p0 = off; off += p.length + 1;
    if(!spans) return `<p data-o="${p0}">${thaiChunk(p, true, term)}</p>`;
    let h = '', i = 0;
    while(i < p.length){
      const code = spkAt(spans, p0 + i);
      let j = i + 1;
      // หาจุดสิ้นสุดของช่วงป้ายนี้ภายในย่อหน้า
      const sp = spans.find(s => p0 + i >= s[0] && p0 + i < s[1]);
      j = sp ? Math.min(p.length, sp[1] - p0) : p.length;
      if(j <= i) j = p.length;
      const cls = code === '?' ? 'Q' : code;
      h += `<span class="sp ${cls}" title="${SPKNAME[code]||''}">${thaiChunk(p.slice(i, j), i === 0, term)}</span>`;
      i = j;
    }
    return `<p data-o="${p0}">${h}</p>`;
  }).join('');
}
// ค้นไทยแบบไม่สนช่องว่าง: แผนที่ตำแหน่งระหว่างข้อความเดิมกับข้อความที่ตัดช่องว่าง
function normThai(s){ let n='', map=[]; for(let i=0;i<s.length;i++){ const c=s[i]; if(/[\s\u200b]/.test(c)) continue; n += c; map.push(i); } return [n, map]; }
const qThai = q => q.replace(/[\s\u200b]+/g,'').replace(/ํา/g,'ำ');
function hlThai(html, term){
  const t = qThai(term); if(!t) return html;
  const [n, map] = normThai(html);
  let out='', last=0, from=0, pos;
  while((pos = n.indexOf(t, from)) !== -1){ const a = map[pos], b = map[pos+t.length-1]+1; if(a<last){from=pos+1;continue;} out += html.slice(last,a)+'<mark>'+html.slice(a,b)+'</mark>'; last=b; from=pos+t.length; }
  return out + html.slice(last);
}

function markTrn(root, id, defU){
  root && root.setAttribute('data-trs', id);
  const notes = (TRN || {})[id]; if(!notes || !root) return 0;

function wrapRange(el, a, b, nt, last){
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const parts = []; let pos = 0, t;
  while((t = tw.nextNode())){ const L = t.nodeValue.length; if(pos + L > a && pos < b) parts.push([t, Math.max(0, a - pos), Math.min(L, b - pos)]); pos += L; }
  parts.forEach(([t, x, y], i) => {
    let mid = t; if(x > 0) mid = t.splitText(x); if(y - x < mid.nodeValue.length) mid.splitText(y - x);
    const sp = document.createElement('span'); sp.className = 'trn ' + (nt.sev || 'low'); sp.dataset.trn = nt.id; sp.title = (TRNK[nt.k] || 'หมายเหตุคำแปล') + ' · กดดูรายละเอียด';

}

          for(const pt of pts){ if(pt[1] < 0) continue; if(pt[1] <= k) off = pt[0]; else break; }  // ชิ้นไทยสุดท้ายที่เริ่มก่อนหรือที่ท่อนนี้
          let best = null;
          if(hasPar && state.parMode!==false){ const pkf = focusTh.split(':')[1].replace(/\.[^.]*$/, ''); best = body.querySelector(`.pblk[data-pk~="${CSS.escape(pkf)}"]`); }
          if(!best) body.querySelectorAll('.thai p[data-o]').forEach(pe => { if(+pe.dataset.o <= off) best = pe; });
          if(best){ best.classList.add('focusp'); best.scrollIntoView({block:'center'}); }
          msg = `ย่อหน้าที่เน้นตรงกับท่อนบาลี ${focusTh} (จับคู่อัตโนมัติ อาจคลาด ±๑ ย่อหน้า)`;
        } else if(meta.subu && meta.subu[focusTh.split(':')[0]]){  // ช่วงสูตรสั้น AN 1–2: ข้อฉบับหลวงของสูตรย่อยนั้น
          const us = meta.subu[focusTh.split(':')[0]]; let first = null;
          us.forEach(u => { const el = body.querySelector(`.thu[data-u="${u}"]`); if(el){ el.classList.add('focusp'); first = first || el; } });
          if(first) first.scrollIntoView({block:'center'});
          msg = `ข้อฉบับหลวงที่เน้นตรงกับสูตร ${focusTh.split(':')[0]} (จับคู่รายสูตรย่อย)`;
        } else msg = `ยังไม่มีการจับคู่รายย่อหน้าสำหรับสูตรนี้ จึงเปิด${curSec!=null?'ตอนที่มีท่อนบาลี':'ทั้งสูตร'} ${focusTh} · ดูท่อนนั้นแบบตรงตัวได้ในแท็บบาลี`;
        const nb = document.createElement('div'); nb.className = 'focusnote'; nb.textContent = msg; body.prepend(nb);
      }
    } else {
      body.innerHTML = 'กำลังโหลดบาลี…';
      const segs = (await loadGroup(meta.g))[id];
      const secIdx = {}; (meta.sec||[]).forEach((sc,n) => secIdx[sc.i] = n);
      let h = curSec!=null ? navHTML() : ''; let prev = null; let cur = 0;
      segs.forEach(sg => {
        if(sg.i in secIdx) cur = secIdx[sg.i];
        if(curSec!=null && cur!==curSec) return;
        if(sg.i in secIdx){ const n = secIdx[sg.i], sc = meta.sec[n]; h += `<div class="sechead" id="sec-${n}"><div class="t">${tdig(n)}. ${esc(secTitle(sc,n))}</div><div class="m">${secMeta(sc)}</div></div>`; if(sg.s==='H') return; }
        h += segHTML(sg, prev); if(sg.s!=='H') prev = sg;
      });
      if(curSec!=null) h += navHTML();
      body.innerHTML = h; bindNav();
      if(focusSeg){ const el = body.querySelector(`.seg[data-id="${CSS.escape(focusSeg)}"]`); if(el){ el.scrollIntoView({block:'center'}); el.style.outline='2px solid var(--accent)'; } }
    }
  };
  $('#main').querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.t; try{localStorage.setItem('bv-tab', state.tab)}catch(e){}; focusSeg = null; renderTab().then(applyBFilter); }));
  $('#main').querySelectorAll('.sectoc a').forEach(a => a.addEventListener('click', e => { e.preventDefault();
    if(curSec!=null){ curSec = +a.dataset.sec; term = null; renderTab().then(() => $('#tabbody').scrollIntoView({block:'start'})); return; }
    const el = document.getElementById('sec-'+a.dataset.sec); if(el) el.scrollIntoView({block:'start'}); }));
  await renderTab(); applyBFilter();
  if(!focusSeg && !term) window.scrollTo({top: $('.grid').offsetTop - 10});
}

function matchSuttaTitles(raw){
  const qTh = qThai(raw), qEn = fold(raw).trim();
  if(!qTh && !qEn) return [];
  const hits = [];
  for(const m of state.index){
    const idMatch = qEn && fold(m.id).includes(qEn);
    const thMatch = qTh && m.tt && qThai(m.tt).includes(qTh);
    const paMatch = qEn && ((m.tp && fold(m.tp).includes(qEn)) || (m.te && fold(m.te).includes(qEn)));
    const secMatch = (m.sec||[]).find(sc => (qTh && sc.h && qThai(sc.h).includes(qTh)) || (qEn && sc.hp && fold(sc.hp).includes(qEn)));
    if(idMatch || thMatch || paMatch || secMatch){
      hits.push({m, sec: secMatch ? m.sec.indexOf(secMatch) : null, secName: secMatch ? (secMatch.h || secMatch.hp) : ''});
    }
  }
  return hits;
}
function renderTitleHits(titleHits){
  if(!titleHits.length) return '';
  const pills = titleHits.slice(0, 30).map(({m, sec, secName}) => {
    const vInfo = m.th ? ` · เล่ม ${tdig(m.th[0])}` : '';
    const sub = secName ? ` · ตอน ${esc(secName)}` : (m.tp ? ` · ${esc(m.tp)}` : '');
    return `<a class="title-pill" href="#${toHash(m.id)}"${sec!=null?` data-sec="${sec}"`:''}><span class="tid">${esc(m.id)}</span><b>${esc(m.tt || m.tp)}</b><span class="tsub">${sub}${vInfo}</span></a>`;
  }).join('');
  return `<section class="card rs title-hits"><h3>ชื่อพระสูตรที่ตรงกับคำค้น (${tdig(titleHits.length)} สูตร${titleHits.length>30?' · แสดง ๓๐ สูตรแรก':''})</h3><div class="title-list">${pills}</div></section>`;
}
async function search(){
  const raw = $('#q').value.trim(); if(!raw) return;
  const lang = $('#lang').value, who = $('#who').value;
  $('#main').innerHTML = '';
  if(lang==='th') return searchThai(raw, who);
  await loadAll('pe');
  const terms = raw.split(/\s+/).filter(Boolean), ft = terms.map(fold);
  const results = []; let segCount = 0;
  for(const meta of state.index){
    const segs = state.groups[meta.g][meta.id]; const hits = [];
    segs.forEach(sg => {
      if(sg.s==='H') return;
      if(who==='A' && sg.l!=='A') return;
      if(who==='AU' && !(sg.l==='A' || sg.s===UNATTR)) return;
      if(who==='AB' && !(sg.l==='A' || sg.l==='B?' || sg.s===UNATTR)) return;
      if(who==='uncertain' && !(sg.l==='B?' || sg.s===UNATTR || sg.s==='?' || (sg.s && sg.s.startsWith('unknown')))) return;
      const hay = lang==='p' ? fold(sg.p) : fold(sg.e);
      if(ft.every(t => hay.includes(t))) hits.push(sg);
    });
    if(hits.length){ results.push([meta, hits]); segCount += hits.length; }
  }
  const titleHits = matchSuttaTitles(raw);
  const tNote = titleHits.length ? `พบชื่อพระสูตรตรงกัน ${tdig(titleHits.length)} สูตร · ` : '';
  $('#status').textContent = (results.length || titleHits.length) ? `${tNote}${results.length ? `เนื้อความพบ ${tdig(segCount)} ท่อน ใน ${tdig(results.length)} สูตร` : 'ไม่พบในเนื้อความ'}` : 'ไม่พบ ลองใช้รากศัพท์สั้นลง หรือเปลี่ยนตัวกรองผู้พูด';
  let html = '<div class="res">' + renderTitleHits(titleHits);
  results.slice(0,120).forEach(([meta, hits]) => {
    html += `<section class="card rs"><h3><a href="#${toHash(meta.id)}">${label(meta.id)} · ${esc(meta.tt||meta.tp)}</a></h3><div class="where">${esc(meta.tp)} · ${esc(meta.te)}</div>`;
    let prev=null; hits.slice(0,5).forEach(sg => { html += segHTML(sg, prev, terms); prev = sg; });
    if(hits.length>5) html += `<div class="segid">อีก ${hits.length-5} ท่อน</div>`;
    html += '</section>';
  });
  if(results.length>120) html += `<div class="status">แสดง ๑๒๐ สูตรแรกจาก ${results.length} สูตร</div>`;
  state.lastSearch = {html: html + '</div>', status: $('#status').textContent, kind: 'pe', raw, y: 0};
  restoreSearch(true);
}
function bindResults(){
  const ls = state.lastSearch;
  if(ls.kind==='pe'){
    $('#main').querySelectorAll('.rs .seg').forEach(el => el.addEventListener('click', () => {
      const sid = el.dataset.id.split(':')[0]; ls.y = window.scrollY; state.fromSearch = true; pendingFocus = el.dataset.id;
      const m = state.byId[sid];
      if(m && m.sec && m.sec.length>1){ const segs = state.groups[m.g][sid]; const pos = segs.findIndex(x => x.i===el.dataset.id); let n = 0; m.sec.forEach((sc,i) => { const si = segs.findIndex(x => x.i===sc.i); if(si>=0 && si<=pos) n = i; }); pendingSec = n; }
      go(sid);
    }));
    $('#main').querySelectorAll('.rs h3 a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); ls.y = window.scrollY; state.fromSearch = true; go(fromHash(a.getAttribute('href').slice(1))); }));
  } else {
    $('#main').querySelectorAll('.rs h3 a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); ls.y = window.scrollY; state.fromSearch = true; pendingTerm = ls.raw; pendingSec = a.dataset.sec!=null ? +a.dataset.sec : null; state.tab='th'; go(fromHash(a.getAttribute('href').slice(1))); }));
  }
}
function restoreSearch(fresh){
  const ls = state.lastSearch; if(!ls) return home();
  $('#main').innerHTML = ls.html; $('#status').textContent = ls.status;
  document.querySelectorAll('.slist a.on').forEach(a=>a.classList.remove('on'));
  bindResults();
  $('#main').querySelectorAll('.title-pill').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); ls.y = window.scrollY; state.fromSearch = true;
    pendingTerm = null; pendingFocus = null;
    pendingSec = a.dataset.sec != null ? +a.dataset.sec : null;
    go(fromHash(a.getAttribute('href').slice(1)));
  }));
  if(!fresh) window.scrollTo({top: ls.y});
}

async function searchThai(raw, who){
  await loadAll('th'); await loadTrn();
  const TU = {}; Object.entries(TRN).forEach(([sid, ns]) => ns.forEach(n => (n.at || []).forEach(([u, a, b]) => (TU[n.v + ':' + u] = TU[n.v + ':' + u] || []).push([a, b, n, sid]))));
  const t = qThai(raw);
  const out = []; let total = 0, filtered = 0;
  await Promise.all(SPKVOLS.map(loadSpk));
  const okCode = c => who==='all' || (who==='A' ? c==='B' : who==='AU' ? (c==='B'||c==='U') : who==='AB' ? (c==='B'||c==='U'||c==='?') : (c==='U'||c==='?'));
  for(const v of THVOLS){
    const arr = state.thai[v];
    const SP = state.spk[v] || null;
    if(!state.thaiNorm[v]) state.thaiNorm[v] = arr.map(u => normThai(u.x));
    arr.forEach((u, i) => {
      const [n, map] = state.thaiNorm[v][i];
      let pos = n.indexOf(t); if(pos === -1) return;
      const sc = u.sc.map(id => state.byId[id]).filter(Boolean);
      const spans = SP ? SP[i] : null;
      const noSpans = !spans;
      if(who!=='all' && noSpans){
        const matchMeta = who==='uncertain'
          ? sc.some(m => m.bq>0 || m.u>0)
          : sc.some(m => m.b>0 || (who!=='A' && (m.u>0 || (who==='AB' && m.bq>0))));
        if(sc.length && !matchMeta) return;
      }
      const metaS = sc.length===1 && sc[0].sec && sc[0].sec.length>1 ? sc[0] : null;
      const groups = new Map();
      while(pos !== -1){
        const off = map[pos]; const key = metaS ? secOfOffset(metaS, off) : -1;
        const code = spans ? spkAt(spans, off) : null;
        if(spans && !okCode(code)){ filtered++; pos = n.indexOf(t, pos+t.length); continue; }
        if(!groups.has(key)) groups.set(key, {first: pos, cnt: 0, code}); groups.get(key).cnt++;
        pos = n.indexOf(t, pos+t.length);
      }
      groups.forEach((g, key) => {
        total += g.cnt;
        const a = map[g.first], b = map[g.first+t.length-1]+1;
        const s0 = Math.max(0, a-90), s1 = Math.min(u.x.length, b+110);
        const snip = (s0>0?'…':'') + esc(u.x.slice(s0,a)) + '<mark>' + esc(u.x.slice(a,b)) + '</mark>' + esc(u.x.slice(b,s1)) + (s1<u.x.length?'…':'');
        const tn = (TU[v + ':' + i] || []).filter(x => x[1] > s0 && x[0] < s1), hitN = tn.some(x => x[1] > a && x[0] < b);
        out.push({v, u, sc, cnt: g.cnt, snip, tn, hitN, code: g.code, noSpans, sec: key>=0 ? key : null, secT: key>=0 ? secTitle(metaS.sec[key], key) : null});
      });
    });
  }
  const titleHits = matchSuttaTitles(raw);
  const tNote = titleHits.length ? `พบชื่อพระสูตรตรงกัน ${tdig(titleHits.length)} สูตร · ` : '';
  $('#status').textContent = (out.length || titleHits.length) ? `${tNote}${out.length ? `เนื้อความพบ ${tdig(total)} แห่ง ใน ${tdig(out.length)} ตอน` : 'ไม่พบในเนื้อความ'}${filtered?` · กรองรายประโยค: ตัดออก ${tdig(filtered)} แห่งที่ไม่ตรงเงื่อนไข`:''}` : 'ไม่พบ ลองพิมพ์คำให้สั้นลง หรือสะกดอีกแบบ (ฉบับหลวงใช้ตัวสะกดเก่าบางคำ เช่น ทิฐิ)';
  let html = '<div class="res">' + renderTitleHits(titleHits);
  out.slice(0,150).forEach(r => {
    const id = r.sc[0] ? r.sc[0].id : null;
    const where = `ฉบับหลวง เล่ม ${tdig(r.v)}${r.u.pg?` หน้า ${tdig(r.u.pg[0])}`:''}${r.u.k?` ข้อ ${tdig(r.u.k[0])}${r.u.k[1]!==r.u.k[0]?'–'+tdig(r.u.k[1]):''}`:''}`;
    const pct = r.sc[0] && r.sc[0].n ? Math.round(100*r.sc[0].b/r.sc[0].n) : null;
    const spkTag = r.code ? ` · <span class="spk">ผู้พูด: ${SPKNAME[r.code]}</span>` : r.noSpans ? ` · <span class="spk" style="color:var(--warn)" title="หน่วยข้อความนี้ยังไม่มีป้ายผู้พูดรายประโยคในฐานข้อมูล">⚠ ยังไม่มีป้ายรายประโยค (กรองระดับสูตร)</span>` : '';
    html += `<section class="card rs"><h3>${id?`<a href="#${toHash(id)}" data-term="1"${r.sec!=null?` data-sec="${r.sec}"`:''}>${esc(r.u.t||'(ไม่มีชื่อ)')}${r.secT?` · ตอน ${esc(r.secT)}`:''}</a>`:esc(r.u.t||'(ไม่มีชื่อ)')}</h3>
      <div class="where">${where}${id?` · ${label(id)}`:''}${r.sec!=null?` · ตอนที่ ${tdig(r.sec)}`:''}${pct!==null&&r.sec==null?` · พระดำรัส ${pct}%`:''}${r.sec!=null&&r.sc[0].sec?` · ตอนนี้พระดำรัส ${r.sc[0].sec[r.sec].b}%`:''}${r.cnt>1?` · พบ ${tdig(r.cnt)} แห่งในตอนนี้`:''}${spkTag}</div>
      <p class="snip">${r.snip}</p>${r.tn && r.tn.length ? `<div class="trnflag ${r.tn.some(x => x[2].sev === 'high') ? 'high' : 'mid'}">※ ${r.hitN ? 'คำที่ค้นอยู่ในจุดที่มีหมายเหตุคำแปล' : 'ข้อความนี้มีหมายเหตุคำแปล'}: ${[...new Map(r.tn.map(x => [x[2].id, x])).values()].slice(0, 3).map(x => `<button type="button" data-trn="${esc(x[2].id)}" data-trs="${esc(x[3])}">“${esc(x[2].th)}” · ${esc(TRNS[x[2].sev] || '')}</button>`).join(' ')}</div>` : ''}</section>`;
  });
  if(out.length>150) html += `<div class="status">แสดง ๑๕๐ ตอนแรก เพิ่มคำค้นให้เจาะจงขึ้น</div>`;
  state.lastSearch = {html: html + '</div>', status: $('#status').textContent, kind: 'th', raw, y: 0};
  restoreSearch(true);
}

async function routeSeg(base, seg, th){
  const id = fromHash(base), meta = state.byId[id];
  if(!meta){ showSutta(id); return; }
  let n = null;
  if(meta.sec && meta.sec.length > 1){
    const segs = (await loadGroup(meta.g))[id] || []; const pos = segs.findIndex(x => x.i === seg);
    if(pos >= 0){ n = 0; meta.sec.forEach((sc,i) => { const si = segs.findIndex(x => x.i === sc.i); if(si >= 0 && si <= pos) n = i; }); }
  }
  showSutta(id, th ? null : seg, null, false, n, th ? seg : null);

// แปลงรหัสท่อน seg -> รหัสไฟล์พระสูตร sutta อัตโนมัติ (ทำงานเหมือน sn3_build.py ฝั่งเบราว์เซอร์)
function resolveSuttaId(seg){
  const p = String(seg || '').split(':')[0];
  if(!p) return null;
  if(state.byId[p]) return p;
  const m = p.match(/^([a-z]+)(\d+)(?:\.(\d+))?$/);
  if(!m) return null;
  const nk = m[1], n1 = +m[2], n2 = m[3] != null ? +m[3] : null;
  for(const meta of state.index){
    if(meta.nk !== nk) continue;
    if(meta.id === p) return meta.id;
    const r = meta.id.match(/^([a-z]+)(\d+)(?:\.(\d+))?(?:-(\d+))?$/);
    if(!r || !r[4]) continue;
    if(n2 == null && r[3] == null && +r[2] <= n1 && n1 <= +r[4]) return meta.id;
    if(n2 != null && r[3] != null && +r[2] === n1 && +r[3] <= n2 && n2 <= +r[4]) return meta.id;
  }
  return null;
}
function prepareSnoteData(raw){
  if(!raw || typeof raw !== 'object') throw new Error('ข้อมูลไม่ใช่ JSON Object');
  if(!raw.note || !raw.title) throw new Error('ขาดฟิลด์บังคับ "note" (รหัสเรื่อง) หรือ "title" (ชื่อเรื่อง)');
  if(!Array.isArray(raw.sections) || !raw.sections.length) throw new Error('ขาดรายการ "sections"');
  if(!raw.core || !Array.isArray(raw.core.nodes)) throw new Error('ขาดโครงสร้างแผนภาพแกน "core.nodes"');
  const N = JSON.parse(JSON.stringify(raw));
  const walk = o => {
    if(!o || typeof o !== 'object') return;
    if(Array.isArray(o)){ o.forEach(walk); return; }
    if(typeof o.seg === 'string' && !o.sutta){
      const sid = resolveSuttaId(o.seg);
      if(sid) o.sutta = sid;
    }
    Object.entries(o).forEach(([k, v]) => { if(k !== 'suttas') walk(v); });
  };
  walk(N);
  N.suttas = N.suttas || {};
  Object.values(N.suttas).forEach(S => {
    (S.parts || []).forEach(p => { if(!p.level && p.lv) p.level = p.lv; });
  });
  N.nsuttas = Object.keys(N.suttas).length;
  return N;
}
function snoteMetaOf(N, source, srcUrl){
  return {
    id: N.note, title: N.title, pali: N.pali || '', question: N.question || '',
    updated: N.updated || new Date().toISOString().slice(0, 10),
    version: N.version || 3, sections: (N.sections || []).length,
    suttas: Object.keys(N.suttas || {}).length,
    figures: (N.sections || []).reduce((n, s) => n + (s.figures || []).length, 0),
    shape: (N.core && N.core.shape) || 'cycle',
    _src: source, _url: srcUrl || ''
  };
}
async function loadExternalSnotes(force){
  if(NS.extLoaded && !force) return;
  NS.extMap = {}; NS.extList = [];
  const urls = [...getSnoteUrls()];
  try{
    const fileLinks = await getJSON('data/snote-links.json');
    if(Array.isArray(fileLinks)) fileLinks.forEach(u => { const s = typeof u === 'string' ? u : u.url; if(s && !urls.includes(s)) urls.push(s); });
  }catch(e){}
  const hq = location.hash.match(/[?&]url=([^&]+)/);
  if(hq){ const u = decodeURIComponent(hq[1]); if(u && !urls.includes(u)) urls.unshift(u); }
  await Promise.all(urls.map(async u => {
    try{
      const res = await fetch(u, {cache:'no-cache'});
      if(!res.ok) return;
      const data = await res.json();
      const items = Array.isArray(data) ? data : Array.isArray(data.notes) ? data.notes : [data];
      items.forEach(item => {
        try{
          const prep = prepareSnoteData(item);
          NS.extMap[prep.note] = prep;
          NS.extList = NS.extList.filter(x => x.id !== prep.note);
          NS.extList.push(snoteMetaOf(prep, 'url', u));
        }catch(e){}
      });
    }catch(e){}
  }));
  NS.extLoaded = true;
}
function downloadSnoteJSON(N){
  const clean = JSON.parse(JSON.stringify(N));
  delete clean._src; delete clean._url;
  const blob = new Blob([JSON.stringify(clean, null, 2)], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `snote-${clean.note}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    <div class="gmodal-hd"><h3>🔗 ผูกลิงก์ Short Note ภายนอก (GitHub Gist / Raw JSON)</h3><button type="button" class="x" aria-label="ปิด">×</button></div>
    <div class="gmodal-bd">
      <div>วางลิงก์ <b>Raw JSON URL</b> (เช่น จาก GitHub Gist หรือไฟล์ <code>.json</code> บนเว็บ) เมื่ออัปเดตเนื้อหาที่ลิงก์ต้นทาง หน้าเว็บนี้จะดึงโน้ตฉบับล่าสุดมาแสดงให้อัตโนมัติ</div>
      <div style="display:flex;gap:8px"><input type="url" id="gmNewUrl" placeholder="https://gist.githubusercontent.com/.../raw/snote-xxx.json"><button type="button" class="prim" id="gmAddUrl" style="white-space:nowrap;padding:6px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer">เพิ่มลิงก์</button></div>
      <div id="gmUrlList"></div>
      <div id="gmUrlMsg"></div>
    </div>
    <div class="gmodal-ft">
      <button type="button" id="gmRefreshUrl">ดึงข้อมูลใหม่เดี๋ยวนี้</button>
      <button type="button" class="prim" id="gmDoneUrl">เสร็จสิ้น</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  renderList();
  const close = () => { bg.remove(); NS.id = null; showSnoteMenu(); };
  bg.querySelector('.x').onclick = close;
  $('#gmDoneUrl').onclick = close;
  bg.onclick = e => { if(e.target === bg) close(); };
  $('#gmAddUrl').onclick = async () => {
    const inp = $('#gmNewUrl'), u = inp.value.trim(), msg = $('#gmUrlMsg');
    if(!u) return;
    msg.innerHTML = 'กำลังทดสอบดึงข้อมูลจากลิงก์…';
    try{
      const r = await fetch(u, {cache:'no-cache'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      const first = Array.isArray(d) ? d[0] : Array.isArray(d.notes) ? d.notes[0] : d;
      prepareSnoteData(first);
      const arr = getSnoteUrls();
      if(!arr.includes(u)){ arr.push(u); setSnoteUrls(arr); }
      inp.value = ''; renderList();
      msg.innerHTML = `<div class="gok">เชื่อมต่อสำเร็จ! พบโน้ต "${esc(first.title)}"</div>`;
      await loadExternalSnotes(true);

      msg.innerHTML = `<div class="gerr">ดึงข้อมูลไม่สำเร็จ: ${esc(err.message)} (ตรวจสอบว่าใช้ลิงก์ Raw JSON และเปิดสาธารณะ)</div>`;

    await loadExternalSnotes(true);
    $('#gmUrlMsg').innerHTML = `<div class="gok">อัปเดตเรียบร้อย (พบโน้ตภายนอก ${tdig(NS.extList.length)} เรื่อง)</div>`;
  };
}

function s3sent(s, figOf){
  const cl = ['s3s', s.lv === 'R' ? 'R' : '', s.mark ? 'mk-' + s.mark : '', s.lv == null ? 'ot' : ''].join(' ');
  const pre = ({warn:'⚠ ', contrast:'⇄ ', gap:'? '})[s.mark] || '';
  let tag = '';
  if(s.lv == null) tag = `<span class="s3who" title="ไม่ใช่พระดำรัส">${esc(s.who || 'คำบรรยาย')}</span>`;
  else if(s.lv === 'B' || s.lv === 'BP') tag = lvB(s.lv) + (s.who ? `<span class="s3who b">${esc(s.who)}</span>` : '');
  else tag = lvB(s.lv);
  const f = figOf && s.id && figOf[s.id];
  const fl = f ? `<a class="s3fl" href="#" data-fig="${esc(f.id)}" style="--c:${f.c}">${n3ic('eye', 13)}${esc(f.no)}</a>` : '';
  return `<span class="${cl}"${s.id ? ` id="s3-${esc(s.id)}"` : ''}>${pre}${esc(s.t)}${tag}${rcHTML(s.ref)}${fl}</span> `;
}

function s3step(s, eq){
  const r0 = s.ref && s.ref[0] && s.ref[0].seg, el = (s.ref || []).some(r => r.elided);
  return `<div class="stp${el ? ' el' : ''}${s.mark === 'key' ? ' key' : ''}"${r0 ? ` data-seg="${esc(r0)}"` : ''}>${s.value ? `<span class="vl">${esc(s.value)}</span>` : ''}${esc(s.text)}${lvB(s.lv)}${rcHTML(s.ref)}${s.note ? `<span class="nn">${esc(s.note)}</span>` : ''}${eq && r0 && eq[r0] ? `<span class="eq">⇆ ตรงกับ ${esc(eq[r0])}</span>` : ''}</div>`;
}

function s3figBody(f){
  const d = f.data || {};
  if(f.shape === 'ladder'){
    const cols = [...d.columns].sort((a, b) => (b.sutta === f.start) - (a.sutta === f.start));
    const head = c => `${esc(c.title)}${c.sutta === f.start && cols.length > 1 ? '<span class="s3start">เริ่มอ่านเสานี้</span>' : ''}`;
    const up = '<span class="s3axis" aria-hidden="true">↑ ขั้นสูงขึ้น</span>';
    if(d.rows){
      const rows = [...d.rows].reverse();
      let h = `<div class="ld-rows" style="grid-template-columns:7.2em repeat(${cols.length},minmax(0,1fr))"><span class="s3ax">${up}</span>${cols.map(c => `<span class="hd">${head(c)}</span>`).join('')}`;
      rows.forEach((r, k) => { h += `<span class="rl${k === 0 ? ' top' : ''}">${esc(r.label)}</span>`;
        cols.forEach(c => { const s = c.steps.find(x => x.row === r.key); h += s ? s3step(s) : '<span class="stp empty"></span>'; }); });
      return h + '</div><div class="s3bot">ขั้นล่างสุด · เริ่มอ่านจากตรงนี้แล้วไล่ขึ้น</div>';
    }
    const name = {}; cols.forEach(c => c.steps.forEach(s => { if(s.ref && s.ref[0]) name[s.ref[0].seg] = label(c.sutta) + ': ' + s.text.slice(0, 24) + (s.text.length > 24 ? '…' : ''); }));
    const eq = {}; (d.same || []).forEach(([a, b]) => { eq[a] = name[b]; eq[b] = name[a]; });
    return `<div class="ld-wrap"><div class="ld-cols" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">${cols.map(c => `<div class="ld-col"><h5>${head(c)}</h5><div class="up">↑ ผลมากขึ้น</div><div class="stk">${c.steps.map(s => s3step(s, eq)).join('')}</div><div class="up">ขั้นแรก ↓ เริ่มที่นี่</div></div>`).join('')}<svg class="ld-svg" aria-hidden="true" data-same='${esc(JSON.stringify(d.same || []))}'></svg></div></div>
      ${(d.same || []).length ? `<div class="s3lk"><i></i> เส้นประข้ามเสา = ขั้นที่${d.align === 'room' ? 'ห้องสนทนาเห็นว่า' : ''}ตรงกัน${d.align === 'room' ? ' (ตัวบทไม่ได้โยงเอง)' : ''} · บนจอแคบแสดงเป็นป้าย ⇆</div>` : ''}`;
  }
  if(f.shape === 'pair'){
    const [L, R] = d.sides, n = Math.max(L.items.length, R.items.length), win = d.winner;
    const hd = s => `<div class="pc hd${s.title === win ? ' win' : ''}">${esc(s.title)}${s.title === win ? `<span class="s3win">★ ตัวบทชี้ว่าเลิศ / ดีกว่า</span>` : ''}</div>`;
    let h = `<div class="s3pair">${hd(L)}<div class="pv" aria-hidden="true"></div>${hd(R)}`;
    for(let i = 0; i < n; i++){ const a = L.items[i], b = R.items[i];
      const c = (it, s) => it ? `<div class="pc${s.title === win ? ' win' : win ? ' lose' : ''}">${esc(it.text)}${lvB(it.lv)}${rcHTML(it.ref)}</div>` : '<div class="pc empty"></div>';
      h += `${c(a, L)}<div class="pv" aria-hidden="true">${win ? (R.title === win ? '‹' : '›') : '·'}</div>${c(b, R)}`; }
    h += '</div>';
    if(d.center || win) h += `<div class="s3res">${d.center ? `<b>${esc(d.center)}</b>` : `<b>ฝั่ง "${esc(win)}" เลิศกว่า</b>`}${d.winner_ref ? ' · ตัวบทตรัสไว้ที่' + rcHTML(d.winner_ref) : ''}</div>`;
    return h;
  }
  if(f.shape === 'list'){
    const fr = (d.items || []).some(x => x.fruit);
    return `<div class="s3cap">${fr ? 'ข้อ → ผลที่ตรัสคู่กับข้อนั้น' : 'หมวดธรรม ' + tdig(d.count || d.items.length) + ' ข้อ'}</div><ol class="ls${fr ? ' fr' : ''}">${d.items.map(it => `<li><span>${esc(it.text)}${lvB(it.lv)}${rcHTML(it.ref)}</span>${fr ? `<span class="ar">→</span><span class="fruit">${esc(it.fruit || '')}</span>` : ''}</li>`).join('')}</ol>`;
  }
  if(f.shape === 'flow'){
    const v = d.steps.length > 4;
    return `<div class="fl${v ? ' v' : ''}">${d.steps.map(s => s3step(s)).join('<span class="ar" aria-hidden="true">→</span>')}</div>`;
  }
  if(f.shape === 'question'){
    return `<div class="qa">${d.items.map(q => `<div><div class="q">${esc(q.q)} <small>— ${esc(q.q_by || '')}</small></div><div class="a">${esc(q.a)}${lvB(q.lv)}${rcHTML(q.ref)}</div></div>`).join('')}</div>`;
  }
  if(f.shape === 'table'){
    return `<div class="s3tw"><table class="s3tb"><thead><tr>${d.cols.map(c => `<th>${esc(c)}</th>`).join('')}<th>อ้างอิง</th></tr></thead><tbody>${d.rows.map(r => `<tr${r.mark === 'key' ? ' class="key"' : ''}>${r.cells.map(c => `<td>${esc(c)}</td>`).join('')}<td class="rf">${lvB(r.lv)}${rcHTML(r.ref)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return `<div class="s3cap">${esc(f.describe || '')}</div>`;
}

function s3fig(f, no, c){
  const d = f.data || {};
  return `<figure class="s3fig" id="s3f-${esc(f.id)}" style="--c:${c}">
    <figcaption><span class="no">${esc(no)}</span><span class="it">${esc(f.intent)}</span></figcaption>
    <div class="s3how">${n3ic('eye', 16)}<span><b>วิธีอ่าน</b> ${esc(f.how_to_read)}</span></div>

    ${d.note ? `<div class="s3cap">ⓘ ${esc(d.note)}</div>` : ''}
    ${(f.told_in || []).length ? `<button type="button" class="s3told" data-told="${esc(f.told_in.join(' '))}">↑ อ่านคำอธิบายรูปนี้ในเรื่อง (${tdig(f.told_in.length)} ประโยค)</button>` : ''}
  </figure>`;
}

// แผนภาพแกน: วงหลักตามเส้นแรกของแต่ละจุด กิ่งข้างวางนอกวง เส้นทึบ = พระสูตรเชื่อม เส้นประ = ห้องสนทนาเชื่อม
function s3core(C){
  const ids = C.nodes.map(n => n.id), byId = Object.fromEntries(C.nodes.map(n => [n.id, n]));
  let ring = [ids[0]], cur = ids[0];
  for(let g = 0; g < ids.length; g++){ const l = C.links.find(x => x.from === cur && (x.to === ids[0] || !ring.includes(x.to))); if(!l || l.to === ids[0]) break; ring.push(l.to); cur = l.to; }
  const closed = C.links.some(x => x.from === ring[ring.length - 1] && x.to === ring[0]);
  if(ring.length < 3 || !closed) ring = ids.slice();
  const W = 600, H = 570, cx = 300, cy = 272, R = 152, RB = 252, P = {}, A = {};
  ring.forEach((id, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / ring.length; A[id] = a; P[id] = [cx + R * Math.cos(a), cy + R * Math.sin(a), 42]; });
  const br = ids.filter(id => !ring.includes(id)), used = {};
  br.forEach(id => {
    const nb = C.links.filter(l => l.from === id || l.to === id).map(l => l.from === id ? l.to : l.from).filter(x => ring.includes(x));
    let a;
    if(nb.length >= 2){ let s = 0, c = 0; nb.forEach(x => { s += Math.sin(A[x]); c += Math.cos(A[x]); }); a = Math.atan2(s, c); }
    else a = (nb.length ? A[nb[0]] : 0) + 0.34;
    const k = Math.round(a * 10); a += (used[k] || 0) * 0.42; used[k] = (used[k] || 0) + 1;
    A[id] = a; P[id] = [Math.min(W - 44, Math.max(44, cx + RB * Math.cos(a))), Math.min(H - 52, Math.max(38, cy + RB * Math.sin(a))), 34];
  });
  let num = 0;
  const L = C.links.map(l => ({...l, n:++num}));
  const edge = l => {
    const [x1, y1, r1] = P[l.from], [x2, y2, r2] = P[l.to], room = l.kind === 'room';
    const ia = ring.indexOf(l.from), ib = ring.indexOf(l.to);
    let d, mx, my;
    if(ia >= 0 && ib >= 0 && (ib - ia + ring.length) % ring.length === 1){
      const g1 = A[l.from] + (r1 + 6) / R, g2 = A[l.to] - (r2 + 8) / R + (ib === 0 ? 2 * Math.PI : 0), gm = (g1 + g2) / 2;
      d = `M${(cx + R * Math.cos(g1)).toFixed(1)},${(cy + R * Math.sin(g1)).toFixed(1)} A${R},${R} 0 0 1 ${(cx + R * Math.cos(g2)).toFixed(1)},${(cy + R * Math.sin(g2)).toFixed(1)}`;
      mx = cx + R * Math.cos(gm); my = cy + R * Math.sin(gm);
    } else {
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
      const sx = x1 + ux * (r1 + 4), sy = y1 + uy * (r1 + 4), ex = x2 - ux * (r2 + 8), ey = y2 - uy * (r2 + 8);
      const bend = ring.includes(l.from) && ring.includes(l.to) ? 0 : 18, qx = (sx + ex) / 2 - uy * bend, qy = (sy + ey) / 2 + ux * bend;
      d = `M${sx.toFixed(1)},${sy.toFixed(1)} Q${qx.toFixed(1)},${qy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}`;
      mx = (sx + 2 * qx + ex) / 4; my = (sy + 2 * qy + ey) / 4;
    }
    return {path:`<path class="${room ? 'room' : 'sut'}" d="${d}" marker-end="url(#s3ar${room ? 'r' : ''})"/>`,
      badge:`<g class="s3lb ${room ? 'room' : 'sut'}" data-l="${l.n}" transform="translate(${mx.toFixed(1)},${my.toFixed(1)})"><circle r="10"/><text y="4" text-anchor="middle">${tdig(l.n)}</text></g>`};
  };
  const E = L.map(edge);
  const node = id => { const nd = byId[id], [x, y, r] = P[id], big = r > 40;
    return `<a class="s3node${big ? '' : ' br'}" href="#snote/${esc(NS.id)}/${esc(nd.section)}" data-go="${esc(nd.section)}" style="--c:${s3col(id)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">

// ย่อหน้าฉบับหลวงของท่อนที่อ้าง (จากแผนที่ระดับท่อน 3A/3B): เน้นช่วงที่อ้างในย่อหน้าบาลีเดียวกัน
async function thaiPara(sid, a, z){
  const meta = state.byId[sid]; if(!meta || !meta.th) return null;
  if(meta.th[1].length !== 1){  // ช่วงสูตรสั้น (AN 1–2): แสดงข้อฉบับหลวงของสูตรย่อยทั้งข้อ
    const us = meta.subu && meta.subu[a.split(':')[0]]; if(!us || us.length !== 1) return null;
    const v = meta.th[0], unit = (await loadThai(v))[us[0]]; if(!unit) return null;
    const segs0 = (await loadGroup(meta.g))[sid] || [], j0 = segs0.findIndex(x => x.i === a), j1 = Math.max(j0, segs0.findIndex(x => x.i === (z || a)));
    const n = unit.x.length, cut = n > 1600;
    return {X:unit.x, A:0, B:cut ? 1600 : n, hA:0, hB:cut ? 1600 : n, cutA:false, cutB:cut, u:us[0], spans:((await loadSpk(v)) || {})[us[0]] || null, key:`ข้อ ${tdig(unit.k[0])}`, segs:segs0.slice(j0, j1 + 1)};
  }
  const v = meta.th[0], u = meta.th[1][0], unit = (await loadThai(v))[u]; if(!unit || unit.sc.length !== 1) return null;
  const pts = (((await loadAln(v)) || {})[u] || []).filter(p => p[1] >= 0).sort((x, y) => x[0] - y[0]);
  if(pts.length < 3) return null;
  const segs = (await loadGroup(meta.g))[sid] || [], ix = id => segs.findIndex(x => x.i === id);
  const i0 = ix(a), i1 = Math.max(i0, ix(z || a)); if(i0 < 0) return null;
  const st = i => { let o = null; for(const p of pts){ if(p[1] <= i) o = p[0]; else break; } return o == null ? pts[0][0] : o; };
  const en = i => { for(const p of pts){ if(p[1] > i && p[0] > st(i)) return p[0]; } return unit.x.length; };
  const pk = i => { const b = segs[i].i.split(':')[1], k = b.lastIndexOf('.'); return k < 0 ? b : b.slice(0, k); };
  let pa = i0, pb = i1; while(pa > 0 && pk(pa - 1) === pk(i0)) pa--; while(pb + 1 < segs.length && pk(pb + 1) === pk(i1)) pb++;

}
function paraHTML(P){
  let h = '<p>' + (P.cutA ? '… ' : '') + `<span data-o="${P.A}">`, i = P.A;
  while(i < P.B){
    const c = P.X[i];

    const lab = P.spans ? spkAt(P.spans, i) : 'B', hl = i >= P.hA && i < P.hB;
    let j = i + 1; while(j < P.B && P.X[j] !== '\n' && (P.spans ? spkAt(P.spans, j) : 'B') === lab && (j >= P.hA && j < P.hB) === hl) j++;
    h += `<span class="sp ${lab === '?' ? 'Q' : lab}${hl ? ' cite' : ''}" title="${SPKNAME[lab] || ''}">${thaiChunk(P.X.slice(i, j), false)}</span>`; i = j;
  }
  return h + '</span>' + (P.cutB ? ' …' : '') + '</p>';
}

  dr.querySelector('.x').onclick = closeSutta;
  if(S) $('#n3sum').onclick = () => openSutta(sid, a, z);
  dr.classList.add('open'); $('#nscrim').classList.add('open'); dr.scrollTop = 0; dr.focus();
  const pv = $('#n3pv');
  try{
    const P = await thaiPara(sid, a, z);
    const segs = P ? P.segs : (() => null)();
    let pali = segs; if(!pali){ const g = (await loadGroup(meta.g))[sid] || [], i0 = g.findIndex(x => x.i === a), i1 = g.findIndex(x => x.i === (z || a)); pali = g.slice(i0, Math.max(i0, i1) + 1); }
    const ph = pali.slice(0, 12).map(x => `<div class="s ${cls(x) === 'B' ? 'B' : cls(x) === 'O' ? 'O' : ''}"><span class="w">${esc(x.i)} · ${esc((whoLabel(x) || ['ผู้รวบรวม'])[0])}</span><div class="p">${esc(x.p)}</div></div>`).join('') + (pali.length > 12 ? `<div class="w">… อีก ${tdig(pali.length - 12)} ท่อน</div>` : '');
    pv.innerHTML = (P ? `<div class="n3ph"><span>ย่อหน้า ${esc(P.key)} · ฉบับหลวง</span><span class="lg"><i class="cite">พื้นเหลือง</i> = ช่วงที่โน้ตอ้าง</span></div><div class="thai n3th" lang="th">${paraHTML(P)}</div><div class="n3note">จับคู่ย่อหน้าอัตโนมัติ (Phase 3A) อาจคลาด ±๑ ประโยค · สีตัวอักษร = ผู้พูด</div>`
      : `<div class="n3note">สูตรนี้ฉบับหลวงรวมไว้กับสูตรอื่นในหน่วยเดียว จึงยังตัดเป็นย่อหน้าไม่ได้ — กด "อ่านทั้งสูตร" เพื่อเปิดฉบับหลวงทั้งหน่วย</div>`)
      + `<details class="n3pali"${P ? '' : ' open'}><summary>บาลีของช่วงที่อ้าง (${tdig(pali.length)} ท่อน)</summary><div class="pv">${ph}</div></details>`;
    if(P){ await loadTrn(); const nm = markTrn(pv.querySelector('.n3th'), sid, P.u); if(nm){ const d = document.createElement('div'); d.className = 'n3note trnn'; d.innerHTML = `<span class="trn mid demo">ขีดเส้นใต้สีส้ม</span><sup class="trn-i mid demo">※</sup> = ย่อหน้านี้มีหมายเหตุคำแปล (คำแปลคลาด คำเติม หรือพิมพ์ผิด) กดที่ข้อความเพื่อดูบาลีและคำที่ควรเป็น`; pv.querySelector('.n3th').after(d); } }
  }catch(e){ pv.textContent = 'โหลดไม่สำเร็จ: ' + e.message; }
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(/^(note|map)(\/|$)/.test(h)){ location.replace('#snote/' + (h.split('/')[1] || 'dana')); return; }  // ลิงก์เก่าของฉบับ ๒ และแผนผัง
  if(h === 'trn'){ showTrnIndex(); return; }
  if(/^snote(\/|\?|$)/.test(h)){ const baseH = h.split('?')[0]; const ps = baseH.split('/');
    if(!ps[1]){ showSnoteMenu(); return; }
    showSnote(ps[1]).then(() => { const el = ps[2] && document.getElementById('s3-' + ps[2]); if(el) el.scrollIntoView({block:'start'}); else window.scrollTo(0, 0); }); return; }
  if(state.view === 'note' || state.view === 'trn') state.fromMap = state.noteId;
  else if(!/^[a-z]/.test(h)) state.fromMap = null;
  setView('read');
  // ลิงก์ลึกระดับท่อน: #an8-37@an8.37:1.3 (แท็บบาลี) หรือ #mn142@mn142:7.5!th (แท็บไทย ย่อหน้าที่จับคู่กับท่อนนั้น)
  const ms = h.match(/^([^@]+)@([^!]+?)(!th)?$/);
  if(ms){ routeSeg(ms[1], ms[2], !!ms[3]); return; }
  if(/^(sn\d+-|an\d+-|dn\d+$|mn\d+$|dhp\d+-\d+$|ud\d+-|iti\d+$|snp\d+-)/.test(h)){ const f = pendingFocus, t = pendingTerm, fs = state.fromSearch, sn = pendingSec; pendingFocus = null; pendingTerm = null; pendingSec = null; state.fromSearch = false; showSutta(fromHash(h), f, t, fs || (state.lastSearch && state.lastSearch.nav === h), sn); if(fs && state.lastSearch) state.lastSearch.nav = h; }
  else if(state.lastSearch) restoreSearch();
  else home();
}
$('#lang').addEventListener('change', () => { $('#q').placeholder = $('#lang').value==='th' ? 'ค้นคำไทย เช่น วิญญาณ, อนาคามี' : $('#lang').value==='p' ? 'ค้นบาลี เช่น viññāṇa (พิมพ์ vinnana ได้)' : 'ค้นอังกฤษ เช่น consciousness'; });
$('#sf').addEventListener('submit', e => { e.preventDefault(); if(location.hash) history.replaceState(null,'',location.pathname); search(); });
window.addEventListener('hashchange', route);
$('#navRead').addEventListener('click', e => { e.preventDefault(); $('#homeLink').click(); });
$('#homeLink').addEventListener('click', e => { e.preventDefault(); state.lastSearch = null; state.fromMap = null; setView('read'); $('#q').value = ''; if(location.hash) history.pushState(null, '', location.pathname); home(); window.scrollTo(0, 0); });
(async () => {
  try{
    const [dn, mn, sn, an, kn] = await Promise.all([getJSON('data/dn-index.json'), getJSON('data/mn-index.json'), getJSON('data/sn-index.json'), getJSON('data/an-index.json'), getJSON('data/kn-index.json')]);
    state.index = dn.concat(mn, sn, an, kn);
    state.index.forEach(s => { s.nk = nkOf(s.id); state.byId[s.id] = s; (state.byGroup[s.g] ||= []).push(s); });
    $('#status').textContent = `${tdig(state.index.length)} สูตร พร้อมอ่าน`;
    renderTOC(); route();
  }catch(err){ $('#status').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + err.message + ' ลองรีเฟรชหน้า'; }
})();

(function(){ const b = document.getElementById('themeBtn'); if(!b) return;
  const cur = () => document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const paint = () => { b.textContent = cur() === 'dark' ? '☀ สว่าง' : '☾ มืด'; b.title = cur() === 'dark' ? 'เปลี่ยนเป็นพื้นหลังสว่าง' : 'เปลี่ยนเป็นพื้นหลังมืด'; };
  b.onclick = () => { const t = cur() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('pk-theme', t); }catch(e){} paint(); if(state.view === 'note') drawSame(); };
  paint(); })();
</script>
